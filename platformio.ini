; Cardputer ADV -> Typeless 语音输入 + Claude Code 控制台 (BLE HID)
; 见 README.md 与 .claude/plans/cardputer-typeless-snug-meerkat.md

[env:cardputer-adv]
platform = espressif32
board = m5stack-stamps3                 ; 官方无 PSRAM 板 (ESP32-S3FN8)
framework = arduino
board_build.partitions = huge_app.csv   ; App 放得下
board_build.f_cpu = 240000000L
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    m5stack/M5Cardputer
    h2zero/NimBLE-Arduino@^1.4.3         ; 锁 1.4.x，T-vK 不兼容 NimBLE 2.x
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1        ; 原生 USB CDC 串口 (调试控制台)
    -D ARDUINO_LOOP_STACK_SIZE=32768
    -D USE_NIMBLE                       ; ESP32-BLE-Keyboard 用 NimBLE 后端省内存

; Launcher 兼容 (bmorcelli/Launcher)，产出 .pio/build/cardputer-adv-launcher/firmware.bin
[env:cardputer-adv-launcher]
extends = env:cardputer-adv
board_build.partitions = partitions_launcher.csv
build_flags =
    ${env:cardputer-adv.build_flags}
    -D LAUNCHER_BUILD=1
